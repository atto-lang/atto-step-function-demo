name: Native workflow case inventory
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Source policy (not guest execution)
        run: sh ci/audit-source.sh
      - name: Ensure fixture count and names are stable
        shell: bash
        run: |
          set -euo pipefail
          test "$(find workflows -maxdepth 1 -type f -name '*.ores' | wc -l)" -eq 9
          test "$(find workflows -maxdepth 1 -type l -print -quit)" = ""
          test -s ci/native-cases.txt
          test -s ci/verify-native.sh
          while IFS= read -r -d '' file; do test -s "$file"; done < <(find workflows -maxdepth 1 -type f -name '*.ores' -print0)
      - name: Verdict disclosure
        run: echo 'SOURCE_ONLY: No native Oreslang compiler execution performed by this job.'
