# Structural-only native manifest integrity, not guest execution.
name: Native workflow case inventory (structural only)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout identity and native-only source policy
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEMO_SHA"
          sh ci/audit-source.sh
      - name: Check tracked AttoLang guests against canonical manifest
        shell: bash
        run: sh ci/check-native-manifest.sh
      - name: Explicit source-only verdict
        run: |
          echo 'SOURCE_ONLY: exact tracked native guest/manifest inventory verified'
          echo 'NOT_EXECUTED: no AttoLang compiler or guest ran in this job'
