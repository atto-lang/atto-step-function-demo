name: AttoLang workflow manifest bijection
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require one manifest oracle for every native workflow
        shell: bash
        run: sh ci/check-native-manifest.sh
