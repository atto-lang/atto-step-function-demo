name: Native Oreslang workflows
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check native-only implementation policy
        shell: bash
        run: |
          set -euo pipefail
          for script in ci/*.sh; do sh -n "$script"; done
          sh ci/test-build-info.sh
          sh ci/test-source-policy.sh
          sh ci/audit-source.sh
      - name: Test native acceptance verifier fails closed
        shell: bash
        run: sh ci/test-native-verifier-negative.sh
      - name: Explain source-only verdict
        run: echo 'Source-policy PASS does not imply compiled or executed .ores guest code.'
  native-guest-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require pinned compiler and execute all thirteen native .ores scenarios
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ORESLANG_BIN: ${{ vars.ORESLANG_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_COMPILER_SHA256 }}
        run: |
          set -euo pipefail
          # No cross-repo private checkout, secret, token, mock, or Node fallback.
          # Repo owner must provision a trusted compiler binary and its digest
          # in this runner. Missing configuration fails closed.
          sh ci/verify-native.sh
