name: Native Oreslang workflows
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Reject JavaScript workflow engines
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(src|scripts|tests)/.*\.(mjs|cjs|js|ts)$|(^|/)package(-lock)?\.json$'; then
            echo 'JavaScript workflow implementations are forbidden' >&2
            exit 1
          fi
          test -f workflows/order-workflow.ores
          test -f workflows/agent-memory-workflow.ores
          test -f workflows/release-review-workflow.ores
          test -f ci/verify-native.sh
      - name: Explain source-only verdict
        run: |
          echo 'Source-policy PASS does not imply compiled or executed .ores guest code.'
  native-guest-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Require real native compiler and execute all six .ores scenarios
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed when the compiler is not present. Never substitute Node or a shim.
          sh ci/verify-native.sh
