name: Native AttoLang workflows
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check native-only implementation policy
        shell: bash
        run: sh ci/audit-source.sh
      - name: Adversarial .atto manifest mutations (host only)
        shell: bash
        run: sh ci/test-atto-manifest.sh
      - name: Validate strict compiler build-info JSON (host only)
        shell: bash
        run: sh ci/test-build-info.sh
      - name: Fail-closed compiler admission mutations (host only)
        shell: bash
        run: bash ci/test-native-precompiler-admission-wave31-20261105.sh
      - name: Explain source-only verdict
        run: echo 'Source-policy PASS does not imply compiled or executed .atto guest code.'
  native-guest-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require pinned compiler and execute all nine native .atto scenarios
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ATTOLANG_BIN: ${{ vars.ATTOLANG_BIN }}
          ATTOLANG_COMPILER_SHA256: ${{ vars.ATTOLANG_COMPILER_SHA256 }}
          ORESLANG_BIN: ${{ vars.ORESLANG_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_COMPILER_SHA256 }}
        run: |
          set -euo pipefail
          # No cross-repo private checkout, secret, token, mock, or Node fallback.
          # Repo owner must provision a trusted compiler binary and its digest
          # in this runner. Missing configuration fails closed.
          sh ci/verify-native.sh
