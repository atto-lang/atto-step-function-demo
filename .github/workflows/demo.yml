name: Oreslang workflow source and Node reference tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-contract-and-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Assert Oreslang-only implementation sources
        run: npm run test:ores-source
      - name: Run Node tests
        run: npm test
      - name: Validate reference graph fixtures
        run: npm run verify:reference
      - name: Execute test-only reference simulation
        run: npm run demo:reference
      - name: Execute test-only saga simulation
        run: npm run demo:saga:reference
      - name: Execute test-only durable storage simulation
        run: npm run demo:durable:reference
# WARNING: These are source-boundary and Node reference tests ONLY.
# They do not compile, execute, or certify Oreslang guest programs.
